
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="TaskFlow te ayuda a organizar tus tareas, establecer fechas límite y seguir tu progreso.">

    <title>TaskFlow | Gestor de tareas</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="encabezado">
        <h1>TaskFlow</h1>

        <nav class="navegacion">
            <a href="#inicio">Inicio</a>
            <a href="#tareas">Mis tareas</a>
            <a href="#" id="abrir-calendario">Calendario</a>
        </nav>
    </header>

    <main>
        <section id="inicio" class="presentacion">
            <h2>Bienvenido a TaskFlow</h2>
            <p>Organizá tus tareas de manera fácil y rápida.</p>
            <a href="#tareas" class="boton">Ver mis tareas</a>
        </section>

        <section id="tareas" class="seccion-tareas">
            <h2>Mis tareas</h2>
            <p class="descripcion">
                Organizá tus actividades y seguí tu progreso.
            </p>

            <form id="formulario-tarea">
                <div>
                    <label for="nombre-tarea">Nombre de la tarea:</label>
                    <input
                        type="text"
                        id="nombre-tarea"
                        placeholder="Ej.: Estudiar programación"
                        required
                    >
                </div>

                <div>
                    <label for="descripcion-tarea">Descripción:</label>
                    <input
                        type="text"
                        id="descripcion-tarea"
                        placeholder="Descripción de la tarea"
                    >
                </div>

                <div>
                    <label for="fecha-limite">Fecha límite:</label>
                    <input type="date" id="fecha-limite">
                </div>

                <button type="submit" class="boton">
                    Agregar tarea
                </button>
            </form>

            <p id="mensaje-tareas" aria-live="polite"></p>

            <div class="lista-tareas" id="lista-tareas"></div>
        </section>

        <section id="contacto" class="contacto">
            <p>Gracias por utilizar TaskFlow.</p>
            <p>Proyecto de Programación Web.</p>
        </section>

        <input
            type="date"
            id="calendario-principal"
            aria-label="Seleccionar una fecha en el calendario"
            tabindex="-1"
        >
    </main>

    <footer class="pie-pagina">
        <p>TaskFlow - Proyecto de Programación</p>
    </footer>
</body>
</html>
