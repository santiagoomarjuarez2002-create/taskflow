<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="TaskFlow te ayuda a organizar tus tareas, establecer fechas límite y seguir tu progreso.">

    <title>TaskFlow | Gestor de tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    
</head>

<body>
    <header>
    <nav class="navbar navbar-expand-md bg-primary" data-bs-theme="dark">
        <div class="container">
            <h1 class="navbar-brand mb-0">
                <a href="#inicio" class="text-white text-decoration-none">
                    TaskFlow
                </a>
            </h1>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir o cerrar menú"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#inicio">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#tareas">Mis tareas</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" id="abrir-calendario">
                            Calendario
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

    <main>
        <section id="inicio" class="presentacion">
            <h2>Bienvenido a TaskFlow</h2>
            <p>Organizá tus tareas de manera fácil y rápida.</p>
            <a href="#tareas" class="boton">Ver mis tareas</a>
        </section>

        <section id="tareas" class="seccion-tareas">
            <h2>Mis tareas</h2>
            <p class="descripcion">
                Organizá tus actividades y seguí tu progreso.
            </p>

            <form id="formulario-tarea">
                <div>
                    <label for="nombre-tarea">Nombre de la tarea:</label>
                    <input type="text" id="nombre-tarea" placeholder="Ej.: Estudiar programación" required>
                </div>

                <div>
                    <label for="descripcion-tarea">Descripción:</label>
                    <input type="text" id="descripcion-tarea" placeholder="Descripción de la tarea">
                </div>

                <div>
                    <label for="fecha-limite">Fecha límite:</label>
                    <input type="date" id="fecha-limite">
                </div>

                <button type="submit" class="boton">
                    Agregar tarea
                </button>
            </form>

            <p id="mensaje-tareas" aria-live="polite"></p>

            <div class="lista-tareas" id="lista-tareas"></div>
        </section>

       <section id="contacto" class="bg-primary-subtle text-center py-4">
    <div class="container">
        <h2 class="h4 text-primary fw-bold mb-3">
            Gracias por utilizar TaskFlow
        </h2>

        <p class="text-body-secondary mb-0">
            Proyecto de Programación Web.
        </p>
    </div>
</section>

        <input type="date" id="calendario-principal" aria-label="Seleccionar una fecha en el calendario" tabindex="-1">
    </main>

    <footer class="bg-dark text-white text-center py-3">
    <div class="container">
        <p class="mb-0">
            TaskFlow - Proyecto de Programación
        </p>
    </div>
</footer>
    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
></script>
</body>

</html>
